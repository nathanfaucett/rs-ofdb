[package]
name = "ofdb-browser-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
worker = []
sync = ["ofdb-sql/sync", "ofdb-kv/sync", "dep:kv-sync", "dep:postcard", "dep:sql-sync"]

[dependencies]
ofdb-kv = { path = "../../crates/kv", default-features = false, features = ["in-memory", "indexeddb"] }
ofdb-sql = { path = "../../crates/sql", default-features = false, features = ["in-memory", "sql", "indexeddb"] }
wasm-bindgen-test = { version = "0.3", default-features = false, features = ["std"] }
js-sys = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1.23", default-features = false, features = ["v7", "std"] }

# KV protocol acceptance fixtures
kv-sync = { version = "0.1", path = "../../crates/kv-sync", package = "ofdb-kv-sync", default-features = false, optional = true }

# SQL protocol acceptance fixtures
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }
sql-sync = { version = "0.1", path = "../../crates/sql-sync", package = "ofdb-sql-sync", default-features = false, optional = true }

# Browser test helpers
kv-store = { version = "0.1", path = "../../crates/kv-store", package = "ofdb-kv-store", default-features = false, features = [] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4", default-features = false, features = ["std"] }

# SQL kernel seam
engine-indexeddb = { version = "0.1", path = "../../crates/sql-engine-indexeddb", package = "ofdb-sql-engine-indexeddb", default-features = false }

# Typed SQL construction
query = { version = "0.1", path = "../../crates/sql-query", package = "ofdb-sql-query", default-features = false }
schema = { version = "0.1", path = "../../crates/sql-schema", package = "ofdb-sql-schema", default-features = false }

# Public storage seams under test
btree-indexeddb = { version = "0.1", path = "../../crates/btree-indexeddb", package = "ofdb-btree-indexeddb", default-features = false, features = [] }
automerge = { version = "0.10", default-features = false, features = [] }
btree = { version = "0.1", package = "ofdb-btree", path = "../../crates/btree", default-features = false, features = ["in-memory", "std"] }
engine = { version = "0.1", package = "ofdb-sql-engine", path = "../../crates/sql-engine", default-features = false, features = ["in-memory", "std"] }
engine-automerge = { version = "0.1", package = "ofdb-sql-engine-automerge", path = "../../crates/sql-engine-automerge", default-features = false, features = [] }
value = { version = "0.1", package = "ofdb-value", path = "../../crates/value", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
platform = { version = "0.1", package = "ofdb-platform", path = "../../crates/platform", default-features = false, features = ["time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[profile.dev]
opt-level = 1
debug = 0
