name: Browser IndexedDB

on:
  push:
    branches: [main, browser-indexeddb]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  RUST_MIN_STACK: '16777216'
  WASM_BINDGEN_TEST_TIMEOUT: '240'

jobs:
  feature-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust and Wasm target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
      - name: Test matrix automation
        run: python3 -m unittest discover -s scripts -p test_browser_matrix.py
      - name: Independent facade checks, dependency graphs and browser Clippy
        run: python3 scripts/browser_matrix.py check --timeout 600
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/browser/Cargo.toml --all -- --check
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-feature-matrix
          path: target/browser-matrix
          if-no-files-found: error
          retention-days: 14

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        context: [window, worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust and browser test tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Install Chrome and matching driver
        if: matrix.browser == 'chrome'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: '156.0.8078.47'
          install-chromedriver: true
          install-dependencies: true
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: '158.0.1'
      - name: Configure browser binaries
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          capabilities = {}
          if os.environ['CHROME_BINARY']:
              capabilities['goog:chromeOptions'] = {'binary': os.environ['CHROME_BINARY']}
          if os.environ['FIREFOX_BINARY']:
              capabilities['moz:firefoxOptions'] = {'binary': os.environ['FIREFOX_BINARY']}
          path = Path('tests/browser/webdriver.local.json').resolve()
          path.write_text(json.dumps(capabilities))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'WASM_BINDGEN_TEST_WEBDRIVER_JSON={path}\n')
          PY
      - name: Run full real-browser public API suite
        env:
          BROWSER: ${{ matrix.browser }}
          CONTEXT: ${{ matrix.context }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python3 scripts/browser_matrix.py browser --browser "$BROWSER" --context "$CONTEXT" --timeout 900
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.context }}
          path: target/browser-matrix
          if-no-files-found: error
          retention-days: 14

  native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust and native build prerequisites
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Native protocols, ownership, storage, sync and Clippy
        run: python3 scripts/browser_matrix.py native --timeout 900
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-native-regression
          path: target/browser-matrix
          if-no-files-found: error
          retention-days: 14
