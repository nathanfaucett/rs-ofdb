[package]
name = "ofdb-sql-cli"
description = "One-shot SQL client for ofdb-sql"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sql-cli"
path = "src/main.rs"

[features]
default = []
in-memory = ["ofdb-sql/in-memory"]
redb = ["ofdb-sql/redb"]
remote = ["ofdb-sql/remote"]

[dependencies]
# Internal dependencies
ofdb-sql = { version = "0.1", package = "ofdb-sql", path = "../sql", default-features = false, features = ["sql"] }

# External dependencies
base64 = { version = "0.22", default-features = false, features = ["std"] }
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# Test-only server for end-to-end client checks
ofdb-sql = { version = "0.1", package = "ofdb-sql", path = "../sql", default-features = false, features = ["in-memory", "server", "sql"] }

[[test]]
name = "cli"
required-features = ["in-memory", "remote"]
