[package]
name = "client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Internal dependencies
engine = { path = "../engine", default-features = false, features = ["std"] }
proto = { path = "../proto", default-features = false, features = [] }
protocol = { path = "../protocol", default-features = false, features = [] }
query = { path = "../query", default-features = false, features = [] }

# External dependencies
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.0", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[features]
default = []
unix = []
