syntax = "proto3";
package kvdb.v2;

import "google/protobuf/empty.proto";

// ---------------------------------------------------------------------------
// KV Service
// ---------------------------------------------------------------------------

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_NULL = 1;
  VALUE_TYPE_TYPE = 2;
  VALUE_TYPE_UUID = 3;
  VALUE_TYPE_BOOL = 4;
  VALUE_TYPE_INTEGER = 5;
  VALUE_TYPE_FLOAT = 6;
  VALUE_TYPE_TEXT = 7;
  VALUE_TYPE_JSON = 8;
  VALUE_TYPE_BLOB = 9;
}

message Value {
  oneof kind {
    google.protobuf.Empty null = 1;
    ValueType type = 2;
    bytes uuid = 3;
    bool bool_value = 4;
    int64 integer = 5;
    double float = 6;
    string text = 7;
    JsonValue json = 8;
    bytes blob = 9;
  }
}

message JsonNumber {
  oneof kind {
    int64 i64 = 1;
    uint64 u64 = 2;
    double f64 = 3;
  }
}

message JsonValue {
  oneof kind {
    google.protobuf.Empty null = 1;
    bool bool_value = 2;
    JsonNumber number = 3;
    string string = 4;
    JsonArray array = 5;
    JsonObject object = 6;
  }
}

message JsonArray { repeated JsonValue values = 1; }
message JsonObject { repeated JsonObjectEntry entries = 1; }
message JsonObjectEntry { string key = 1; JsonValue value = 2; }

message GetRequest {
  string key = 1;
  reserved 2;
}

message GetResponse {
  reserved 1;
  Value value = 4;
}

message SetRequest {
  string key = 1;
  reserved 2;
  Value value = 4;
  optional int64 expires_at = 3;
}

message SetResponse {}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {}

message ScanRequest {
  string start = 1;
  string end = 2;
  reserved 3;
}

message ScanPrefixRequest {
  string prefix = 1;
  reserved 2;
}

message ScanEntry {
  string key = 1;
  reserved 2;
  Value value = 4;
}

message ScanResponse {
  repeated ScanEntry entries = 1;
}

message ScanAllRequest {
  reserved 1;
}

message ScanAllResponse {
  repeated ScanEntry entries = 1;
}

message TransactionRequest {
  oneof command {
    GetRequest get = 1;
    SetRequest set = 2;
    DeleteRequest delete = 3;
    ScanRequest scan = 4;
    ScanPrefixRequest scan_prefix = 5;
    ScanAllRequest scan_all = 6;
    google.protobuf.Empty commit = 7;
    google.protobuf.Empty rollback = 8;
  }
}

message TransactionResponse {
  oneof outcome {
    google.protobuf.Empty ready = 1;
    GetResponse got = 2;
    google.protobuf.Empty completed = 3;
    ScanResponse scanned = 4;
    bytes error_detail = 5;
  }
}

service KvService {
  rpc Transaction(stream TransactionRequest) returns (stream TransactionResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc ScanPrefix(ScanPrefixRequest) returns (ScanResponse);
  rpc ScanAll(ScanAllRequest) returns (ScanAllResponse);
}
