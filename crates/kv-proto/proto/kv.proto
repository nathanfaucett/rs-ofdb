syntax = "proto3";
package kvdb;

import "google/protobuf/empty.proto";

// ---------------------------------------------------------------------------
// KV Service
// ---------------------------------------------------------------------------

message GetRequest {
  string key = 1;
  reserved 2;
}

message GetResponse {
  optional bytes value = 1;
}

message SetRequest {
  string key = 1;
  bytes value = 2;
  optional int64 expires_at = 3;
}

message SetResponse {}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {}

message ScanRequest {
  string start = 1;
  string end = 2;
  reserved 3;
}

message ScanPrefixRequest {
  string prefix = 1;
  reserved 2;
}

message ScanEntry {
  string key = 1;
  bytes value = 2;
}

message ScanResponse {
  repeated ScanEntry entries = 1;
}

message ScanAllRequest {
  reserved 1;
}

message ScanAllResponse {
  repeated ScanEntry entries = 1;
}

message TransactionRequest {
  oneof command {
    GetRequest get = 1;
    SetRequest set = 2;
    DeleteRequest delete = 3;
    ScanRequest scan = 4;
    ScanPrefixRequest scan_prefix = 5;
    ScanAllRequest scan_all = 6;
    google.protobuf.Empty commit = 7;
    google.protobuf.Empty rollback = 8;
  }
}

message TransactionResponse {
  oneof outcome {
    google.protobuf.Empty ready = 1;
    GetResponse got = 2;
    google.protobuf.Empty completed = 3;
    ScanResponse scanned = 4;
    bytes error_detail = 5;
  }
}

service KvService {
  rpc Transaction(stream TransactionRequest) returns (stream TransactionResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc ScanPrefix(ScanPrefixRequest) returns (ScanResponse);
  rpc ScanAll(ScanAllRequest) returns (ScanAllResponse);
}
