[package]
name = "ofdb-kv-client"
description = "gRPC client for ofdb KV services"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Internal dependencies
kv-proto = { version = "0.1", path = "../kv-proto", package = "ofdb-kv-proto", default-features = false, features = [] }
value = { version = "0.1", path = "../value", package = "ofdb-value", default-features = false, features = [] }

# External dependencies
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.0", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen", "tls-ring"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[features]
default = []
unix = []
