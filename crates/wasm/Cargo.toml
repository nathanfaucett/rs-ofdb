[package]
name = "ofdb-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser (WASM) TypeScript-facing API for ofdb"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "ofdb_wasm"

[features]
default = ["indexeddb"]
indexeddb = ["ofdb-kv/indexeddb", "ofdb-sql/indexeddb"]
sync = ["ofdb-kv/sync", "ofdb-sql/sync", "indexeddb"]

[dependencies]
# Internal
ofdb-kv = { version = "0.1", path = "../kv", package = "ofdb-kv", default-features = false }
ofdb-sql = { version = "0.1", path = "../sql", package = "ofdb-sql", default-features = false, features = [
    "sql",
] }
ofdb-value = { version = "0.1", path = "../value", package = "ofdb-value", default-features = false, features = [
    "serde_json",
] }
ofdb-btree = { version = "0.1", path = "../btree", package = "ofdb-btree", default-features = false, features = [
    "std",
] }

# WASM
base64 = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { version = "0.3", default-features = false }
