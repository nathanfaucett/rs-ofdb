[package]
name = "ofdb-btree"
description = "Async BTree types and helpers"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "btree"

[features]
default = ["std", "sharded", "in-memory"]
std = [
  "futures/std",
  "async-lock?/std",
  "thiserror/std"
]
changes = ["std", "dep:tokio"]
sharded = ["dep:dashmap"]
in-memory = ["dep:async-stream", "dep:async-lock"]

[dependencies]
# Platform execution
platform = { version = "0.1", path = "../platform", package = "ofdb-platform", default-features = false, features = [] }

# Change notifications
tokio = { version = "1.0", default-features = false, features = ["sync"], optional = true }

# Storage
async-lock = { version = "3.4", default-features = false, features = [], optional = true }
async-stream = { version = "0.3", default-features = false, features = [
], optional = true }
futures = { version = "0.3", default-features = false, features = [] }
thiserror = { version = "2.0", default-features = false, features = [] }
dashmap = { version = "6.2", optional = true, default-features = false, features = [] }

[dev-dependencies]
# Test runtime
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "sync"] }
