[package]
name = "ofdb-sql-sync"
description = "Transport-neutral synchronization for engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sync"
path = "src/lib.rs"

[features]
continuous = ["dep:sync-runtime"]
native-stage = ["dep:tempfile"]
iroh = ["dep:iroh"]

[dependencies]
# Platform execution
platform = { version = "0.1", path = "../platform", package = "ofdb-platform", default-features = false, features = [] }

# internal dependencies
engine = { version = "0.1", path = "../sql-engine", package = "ofdb-sql-engine", default-features = false, features = [] }
sync-runtime = { version = "0.1", path = "../sync-runtime", package = "ofdb-sync-runtime", default-features = false, features = [], optional = true }

# external dependencies
futures = { version = "0.3", default-features = false, features = [] }
iroh = { version = "1.1", default-features = false, features = ["tls-ring"], optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false, features = [] }
uuid = { version = "1.23", default-features = false, features = ["serde"] }
tempfile = { version = "3.27", default-features = false, features = [], optional = true }
thiserror = { version = "2.0", default-features = false, features = [] }
value = { version = "0.1", path = "../value", package = "ofdb-value", default-features = false, features = [] }

[dev-dependencies]
# internal dependencies
engine = { version = "0.1", path = "../sql-engine", package = "ofdb-sql-engine", default-features = false, features = ["in-memory", "std"] }
engine-redb = { version = "0.1", path = "../sql-engine-redb", package = "ofdb-sql-engine-redb", default-features = false, features = [] }

schema = { version = "0.1", path = "../sql-schema", package = "ofdb-sql-schema", default-features = false, features = [] }
sql-translator = { version = "0.1", path = "../sql-translator", package = "ofdb-sql-translator", default-features = false, features = [] }
value = { version = "0.1", path = "../value", package = "ofdb-value", default-features = false, features = [] }

# external dependencies
futures = { version = "0.3", default-features = false, features = ["async-await", "executor", "std"] }
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "time"] }
