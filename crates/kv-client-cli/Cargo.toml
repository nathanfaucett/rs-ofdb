[package]
name = "ofdb-kv-client-cli"
description = "One-shot KV client for ofdb-kv"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kv-client-cli"
path = "src/main.rs"

[features]
default = []
in-memory = ["ofdb-kv/in-memory"]
redb = ["ofdb-kv/redb"]
remote = ["ofdb-kv/remote"]

[dependencies]
# Internal dependencies
ofdb-kv = { version = "0.1", package = "ofdb-kv", path = "../kv", default-features = false, features = [] }

# External dependencies
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# Test-only server for end-to-end client checks
ofdb-kv = { version = "0.1", package = "ofdb-kv", path = "../kv", default-features = false, features = ["in-memory", "server"] }

[[test]]
name = "cli"
required-features = ["remote", "redb"]
