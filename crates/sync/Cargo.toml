[package]
name = "ofdb-sync"
description = "Unified synchronization protocol for KV and SQL"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
name = "sync"

[features]
default = ["std"]
std = ["dep:tokio", "futures/std", "btree/std", "btree/changes"]
wasm = ["dep:wasm-bindgen-futures", "dep:js-sys", "btree/in-memory"]
iroh = ["dep:iroh", "std"]

[dependencies]
# Platform timers
platform = { version = "0.1", path = "../platform", package = "ofdb-platform", default-features = false, features = [
    "time",
] }

# Backend notifications
btree = { version = "0.1", path = "../btree", package = "ofdb-btree", default-features = false, features = [
    "changes",
] }

# Protocol
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
uuid = { version = "1.29", default-features = false, features = [
    "v4",
    "v7",
    "serde",
] }
futures = { version = "0.3", default-features = false, features = [] }
thiserror = { version = "2.0", default-features = false, features = [] }

# Runtime
tokio = { version = "1.0", default-features = false, features = [
    "macros",
    "time",
], optional = true }
iroh = { version = "1.4", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", default-features = false, optional = true }
js-sys = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "test-util",
    "time",
] }
futures = { version = "0.3", default-features = false, features = [
    "executor",
    "std",
] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
