[package]
name = "ofdb-sql-server"
description = "gRPC server for ofdb SQL databases"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Internal dependencies
engine = { version = "0.1", path = "../sql-engine", package = "ofdb-sql-engine", default-features = false, features = ["std"] }
proto = { version = "0.1", path = "../sql-proto", package = "ofdb-sql-proto", default-features = false, features = [] }
protocol = { version = "0.1", path = "../sql-protocol", package = "ofdb-sql-protocol", default-features = false, features = [] }
query = { version = "0.1", path = "../sql-query", package = "ofdb-sql-query", default-features = false, features = [] }

# External dependencies

tokio = { version = "1.0", default-features = false, features = ["net", "rt", "macros", "sync"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "server", "router", "codegen"] }

[dev-dependencies]
# Internal dependencies
client = { version = "0.1", path = "../sql-client", package = "ofdb-sql-client", default-features = false, features = ["unix"] }
engine-automerge = { version = "0.1", path = "../sql-engine-automerge", package = "ofdb-sql-engine-automerge", default-features = false, features = [] }
schema = { version = "0.1", path = "../sql-schema", package = "ofdb-sql-schema", default-features = false, features = ["std"] }
value = { version = "0.1", path = "../sql-value", package = "ofdb-sql-value", default-features = false, features = ["std"] }

# External dependencies
tokio = { version = "1.0", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
default = []
