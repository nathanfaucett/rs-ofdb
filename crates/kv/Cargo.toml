[package]
name = "ofdb-kv"
description = "Embedded and remote key-value database facade"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ofdb_kv"

[features]
default = []
std = []
remote = ["std", "dep:kv-proto", "dep:tonic", "dep:tokio", "tokio/net", "tokio/sync", "dep:tokio-stream", "dep:tower", "dep:hyper-util"]
in-memory = ["std", "dep:btree", "dep:kv-store", "dep:tokio", "dep:uuid", "btree/in-memory"]
redb = ["std", "dep:btree", "dep:kv-store", "dep:tokio", "dep:uuid", "dep:btree-redb", "dep:redb"]
server = ["remote", "dep:kv-server"]
sync = ["std", "dep:btree", "dep:kv-sync", "dep:kv-store", "dep:uuid"]

[dependencies]
# Internal dependencies
btree = { version = "0.1", path = "../btree", package = "ofdb-btree", default-features = false, features = ["std"], optional = true }
btree-redb = { version = "0.1", path = "../btree-redb", package = "ofdb-btree-redb", default-features = false, features = [], optional = true }
kv-server = { version = "0.1", path = "../kv-server", package = "ofdb-kv-server", default-features = false, features = [], optional = true }
kv-store = { version = "0.1", path = "../kv-store", package = "ofdb-kv-store", default-features = false, features = [], optional = true }
kv-sync = { version = "0.1", path = "../kv-sync", package = "ofdb-kv-sync", default-features = false, features = [], optional = true }
kv-proto = { version = "0.1", path = "../kv-proto", package = "ofdb-kv-proto", default-features = false, features = [], optional = true }

# External dependencies
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
redb = { version = "4.3", default-features = false, features = ["uuid"], optional = true }
tokio = { version = "1.0", default-features = false, features = ["time"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["net"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
uuid = { version = "1.23", default-features = false, features = ["v7", "std"], optional = true }

[dev-dependencies]
btree-redb = { version = "0.1", path = "../btree-redb", package = "ofdb-btree-redb", default-features = false, features = [] }
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
kv-client = { version = "0.1", path = "../kv-client", package = "ofdb-kv-client", default-features = false, features = ["unix"] }
kv-sync = { version = "0.1", path = "../kv-sync", package = "ofdb-kv-sync", default-features = false, features = [] }
kv-server = { version = "0.1", path = "../kv-server", package = "ofdb-kv-server", default-features = false, features = [] }
redb = { version = "4.3", default-features = false, features = ["uuid"] }
tempfile = { version = "3.27", default-features = false, features = [] }
tokio = { version = "1.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "embedded_client"
required-features = ["in-memory"]

[[test]]
name = "embedded_redb_client"
required-features = ["redb"]

[[test]]
name = "local_kv"
required-features = ["in-memory", "redb"]

[[test]]
name = "remote_kv"
required-features = ["remote", "in-memory", "redb", "server"]

[[test]]
name = "remote_facade_transaction"
required-features = ["remote", "in-memory", "server"]

[[test]]
name = "cluster_kv"
required-features = ["sync", "in-memory", "redb", "server"]
