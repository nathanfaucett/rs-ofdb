syntax = "proto3";
package db;

import "google/protobuf/empty.proto";

// ---------------------------------------------------------------------------
// Shared / basic types (assumed from schema / value)
// These are referenced by the query types. Adjust or move them to their
// own .proto files if they already exist elsewhere.
// ---------------------------------------------------------------------------

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_NULL = 1;
  VALUE_TYPE_TYPE = 2;
  VALUE_TYPE_UUID = 3;
  VALUE_TYPE_BOOL = 4;
  VALUE_TYPE_INTEGER = 5;
  VALUE_TYPE_FLOAT = 6;
  VALUE_TYPE_TEXT = 7;
  VALUE_TYPE_JSON = 8;
  VALUE_TYPE_BLOB = 9;
}

message Value {
  oneof kind {
    google.protobuf.Empty null = 1;
    ValueType type = 2;
    bytes uuid = 3;
    bool bool_value = 4;
    int64 integer = 5;
    double float = 6;
    string text = 7;
    JsonValue json = 8;
    bytes blob = 9;
  }
}

message JsonNumber {
  oneof kind {
    int64 i64 = 1;
    uint64 u64 = 2;
    double f64 = 3;
  }
}

message JsonValue {
  oneof kind {
    google.protobuf.Empty null = 1;
    bool bool_value = 2;
    JsonNumber number = 3;
    string string = 4;
    JsonArray array = 5;
    JsonObject object = 6;
  }
}

message JsonArray { repeated JsonValue values = 1; }
message JsonObject { repeated JsonObjectEntry entries = 1; }
message JsonObjectEntry { string key = 1; JsonValue value = 2; }

message Row {
  repeated Value values = 1;
}

message ColumnSchema {
  string name = 1;
  ValueType type = 2;
  Value default = 3;
  bool primary_key = 4;
}

message IndexSchema {
  string name = 1;
  string table_name = 2;
  repeated uint32 column_indices = 3;
  bool unique = 4;
}

message TableSchema {
  string name = 1;
  repeated ColumnSchema columns = 2;
  // add primary key, constraints, etc. as needed
}

// ---------------------------------------------------------------------------
// QueryColumn
// ---------------------------------------------------------------------------

message QueryColumn {
  string table  = 1;
  string column = 2;
}

// ---------------------------------------------------------------------------
// QueryJoin
// ---------------------------------------------------------------------------

enum QueryJoinKind {
  QUERY_JOIN_KIND_UNSPECIFIED = 0;
  QUERY_JOIN_KIND_INNER       = 1;
  QUERY_JOIN_KIND_LEFT        = 2;
  QUERY_JOIN_KIND_RIGHT       = 3;
  QUERY_JOIN_KIND_FULL        = 4;
}

message QueryJoin {
  QueryJoinKind kind  = 1;
  string        table = 2;
  QueryExpr     on    = 3;
}

// ---------------------------------------------------------------------------
// Ordering
// ---------------------------------------------------------------------------

enum QuerySortDirection {
  QUERY_SORT_DIRECTION_UNSPECIFIED = 0;
  QUERY_SORT_DIRECTION_ASC         = 1;
  QUERY_SORT_DIRECTION_DESC        = 2;
}

message QueryOrderBy {
  QueryColumn        by        = 1;
  QuerySortDirection direction = 2;
}

// ---------------------------------------------------------------------------
// Expressions
// ---------------------------------------------------------------------------

message QueryExprValue {
  oneof kind {
    QueryColumn column = 1;
    Value       value  = 2;
    string excluded_column = 3;
  }
}

message QueryExpr {
  oneof kind {
    QueryExprValue value               = 1;
    QueryExpr      not                 = 2;
    QueryExpr      exists              = 3;
    QueryExpr      is_null             = 4;
    QueryExpr      is_not_null         = 5;
    BinaryExpr     equals              = 6;
    BinaryExpr     not_equals          = 7;
    BinaryExpr     less_than           = 8;
    BinaryExpr     less_than_or_equals = 9;
    BinaryExpr     greater_than        = 10;
    BinaryExpr     greater_than_or_equals = 11;
    InListExpr     in_list             = 12;
    InSubqueryExpr in_subquery         = 13;
    LikeExpr       like                = 14;
    BinaryExpr     and                 = 15;
    BinaryExpr     or                  = 16;
  }
}

message BinaryExpr {
  QueryExpr left  = 1;
  QueryExpr right = 2;
}

message InListExpr {
  QueryExpr          expr    = 1;
  repeated QueryExpr list    = 2;
  bool               negated = 3;
}

message InSubqueryExpr {
  QueryExpr   expr     = 1;
  QuerySelect subquery = 2;
  bool negated = 3;
}

message LikeExpr {
  QueryExpr expr    = 1;
  QueryExpr pattern = 2;
}

// ---------------------------------------------------------------------------
// Aggregates
// ---------------------------------------------------------------------------

message QueryCountTarget {
  oneof kind {
    google.protobuf.Empty all_rows       = 1; // COUNT(*)
    string                single         = 2; // COUNT(col)
    string                distinct       = 3; // COUNT(DISTINCT col)
    DistinctMulti         distinct_multi = 4; // COUNT(DISTINCT col1, col2, ...)
  }
}

message DistinctMulti {
  repeated string columns = 1;
}

message QueryAggregate {
  oneof kind {
    QueryCountTarget count = 1;
    QueryColumn      sum   = 2;
    QueryColumn      avg   = 3;
    QueryColumn      min   = 4;
    QueryColumn      max   = 5;
  }
}

// ---------------------------------------------------------------------------
// FROM / JOIN clause
// ---------------------------------------------------------------------------

message QueryFrom {
  string             table = 1;
  repeated QueryJoin joins = 2;
}

// ---------------------------------------------------------------------------
// UPDATE assignment
// ---------------------------------------------------------------------------

message QueryUpdateAssignment {
  QueryColumn    column = 1;
  QueryExprValue value  = 2;
}

// ---------------------------------------------------------------------------
// Result types
// ---------------------------------------------------------------------------

message QueryResultColumn {
  string name          = 1;
  optional string source_table  = 2;
  optional string source_column = 3;
}

message QueryResult {
  repeated Row               rows    = 1;
  repeated QueryResultColumn columns = 2;
}

// ---------------------------------------------------------------------------
// SELECT
// ---------------------------------------------------------------------------

message QuerySelect {
  QueryFrom              from       = 1;
  repeated QueryColumn   projection = 2;
  optional QueryExpr     predicate  = 3;
  repeated QueryAggregate aggregates = 4;
  repeated QueryColumn   group_by   = 5;
  repeated QueryOrderBy  order_by   = 6;
  optional uint64        limit      = 7;
  optional uint64        offset     = 8;
  optional QueryHavingCount having = 9;
  repeated OptionalQueryTextConcat text_concats = 10;
  bool distinct = 11;
}

enum QueryHavingCountOperator {
  QUERY_HAVING_COUNT_OPERATOR_UNSPECIFIED = 0;
  QUERY_HAVING_COUNT_OPERATOR_GREATER_THAN = 1;
  QUERY_HAVING_COUNT_OPERATOR_GREATER_THAN_OR_EQUALS = 2;
}

message QueryHavingCount {
  QueryHavingCountOperator operator = 1;
  int64 value = 2;
}

message QueryTextConcat {
  QueryColumn column = 1;
  string literal = 2;
  string alias = 3;
}

message OptionalQueryTextConcat {
  QueryTextConcat value = 1;
}

// ---------------------------------------------------------------------------
// INSERT
// ---------------------------------------------------------------------------

message QueryInsert {
  string table = 1;
  Row row = 2;
  ReturningStrings returning = 3;
}

message ReturningStrings {
  repeated string columns = 1;
}

message ReturningColumns {
  repeated QueryColumn columns = 1;
}

enum QueryInsertValueKind {
  QUERY_INSERT_VALUE_KIND_UNSPECIFIED = 0;
  QUERY_INSERT_VALUE_KIND_VALUE       = 1;
  QUERY_INSERT_VALUE_KIND_DEFAULT     = 2;
}

message QueryInsertValue {
  oneof kind {
    Value value   = 1;
    google.protobuf.Empty default = 2;
  }
}

message QueryInsertValues {
  string table = 1;
  repeated string columns = 2;
  repeated QueryInsertRow rows = 3;
  ReturningStrings returning = 4;
  StringList on_conflict_do_nothing = 5;
  ConflictUpdate on_conflict_do_update = 6;
}

message QueryInsertRow {
  repeated QueryInsertValue values = 1;
}

message StringList {
  repeated string values = 1;
}

message ConflictUpdate {
  repeated string columns = 1;
  repeated QueryUpdateAssignment assignments = 2;
}

// ---------------------------------------------------------------------------
// UPDATE
// ---------------------------------------------------------------------------

message QueryUpdate {
  QueryFrom                      from         = 1;
  repeated QueryUpdateAssignment assignments  = 2;
  optional QueryExpr             predicate    = 3;
  ReturningColumns returning = 4;
}

// ---------------------------------------------------------------------------
// DELETE
// ---------------------------------------------------------------------------

message QueryDelete {
  QueryFrom            from      = 1;
  optional QueryExpr   predicate = 2;
  ReturningColumns returning = 3;
}

// ---------------------------------------------------------------------------
// Top-level Query
// ---------------------------------------------------------------------------

message Query {
  oneof kind {
    QuerySelect       select        = 1;
    QueryInsert       insert        = 2;
    QueryInsertValues insert_values = 3;
    QueryUpdate       update        = 4;
    QueryDelete       delete        = 5;
  }
}

// ---------------------------------------------------------------------------
// DDL – AlterTable / AlterIndex operations
// ---------------------------------------------------------------------------

message AlterTableOperation {
  oneof kind {
    ColumnSchema add_column     = 1;
    string       drop_column    = 2;
    RenameColumn rename_column  = 3;
    RenameTable  rename_table   = 4;
    IndexSchema  add_index      = 5;
    RenameIndex  rename_index   = 6;
    string       drop_index     = 7;
  }
}

message RenameColumn {
  string old_name = 1;
  string new_name = 2;
}

message RenameTable {
  string new_name = 1;
}

message RenameIndex {
  string old_name = 1;
  string new_name = 2;
}

message AlterIndexOperation {
  oneof kind {
    RenameIndexOp rename = 1;
  }
}

message RenameIndexOp {
  string new_name = 1;
}

// ---------------------------------------------------------------------------
// DataDefinition
// ---------------------------------------------------------------------------

message DataDefinition {
  oneof kind {
    CreateTable            create_table              = 1;
    CreateTableWithIndexes create_table_with_indexes = 2;
    AlterTable             alter_table               = 3;
    DropTable              drop_table                = 4;
    CreateIndex            create_index              = 5;
    CreateIndexUnresolved  create_index_unresolved   = 6;
    AlterIndex             alter_index               = 7;
    DropIndex              drop_index                = 8;
  }
}

message CreateTable {
  TableSchema schema        = 1;
  bool        if_not_exists = 2;
}

message CreateTableWithIndexes {
  TableSchema          schema        = 1;
  repeated IndexSchema indexes       = 2;
  bool                 if_not_exists = 3;
}

message AlterTable {
  string                     table_name = 1;
  repeated AlterTableOperation operations = 2;
  bool                       if_exists  = 3;
}

message DropTable {
  string table_name = 1;
  bool   if_exists  = 2;
}

message CreateIndex {
  IndexSchema schema        = 1;
  bool        if_not_exists = 2;
}

message CreateIndexUnresolved {
  string          index_name    = 1;
  string          table_name    = 2;
  repeated string column_names  = 3;
  bool            unique        = 4;
  bool            if_not_exists = 5;
}

message AlterIndex {
  string              index_name = 1;
  AlterIndexOperation operation  = 2;
  bool                if_exists  = 3;
}

message DropIndex {
  string index_name = 1;
  bool   if_exists  = 2;
}

// ---------------------------------------------------------------------------
// Top-level Statement
// ---------------------------------------------------------------------------

message Statement {
  oneof kind {
    Query          query           = 1;
    DataDefinition data_definition = 2;
  }
}

service QueryService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Transaction(stream TransactionRequest) returns (stream TransactionResponse);
}

message TransactionRequest {
  oneof command {
    ExecuteRequest execute = 1;
    google.protobuf.Empty commit = 2;
    google.protobuf.Empty rollback = 3;
  }
}

message TransactionResponse {
  oneof outcome {
    google.protobuf.Empty ready = 1;
    ExecuteResponse executed = 2;
    google.protobuf.Empty completed = 3;
    bytes error_detail = 4;
  }
}

message ExecuteRequest {
  repeated Statement statements = 1;
}

message ExecuteResponse {
  repeated QueryResult results = 1;
}
